name: Filmmakers Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 🔹 Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 🔹 Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v1
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: pip install requests beautifulsoup4 deep-translator

      - name: Run script
        run: python script.py
        env:
          WEBHOOK: ${{ secrets.WEBHOOK }}

      - name: Save state
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add seen_ids.json || true
          git diff --staged --quiet || (git commit -m "update seen posts" && git push)
